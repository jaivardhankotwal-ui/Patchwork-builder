openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /incidents/{id}/create-pr:
    post:
      operationId: createIncidentPr
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Draft pull request opened or existing request returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
  /incidents/{id}/slack:
    post:
      operationId: sendIncidentSlack
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Slack delivery result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
  /webhooks/sentry:
    post:
      operationId: receiveSentryWebhook
      description: Requires sentry-hook-signature HMAC SHA256 over the raw request body. Accepts normalized incident JSON or Sentry event data with repository metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SentryInput" }
      responses:
        "202":
          description: Persisted and queued; duplicate deliveries return the original job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookJob" }
  /webhooks/sentry/simulate:
    post:
      operationId: simulateSentryWebhook
      description: Submit a simulated trace from the dashboard through the same durable analysis queue.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentInput" }
      responses:
        "202":
          description: Simulation queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookJob" }
  /webhooks/jobs:
    get:
      operationId: listWebhookJobs
      responses:
        "200":
          description: Recent webhook progress and failures
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WebhookJob" }
  /config:
    get:
      operationId: getConfig
      responses:
        "200":
          description: Connection status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Config"
  /simulate:
    post:
      operationId: simulateIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepositoryInput"
      responses:
        "200":
          description: Synthetic trace using a real repository path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Simulation"
  /incidents:
    get:
      operationId: listIncidents
      responses:
        "200":
          description: Incident history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Incident"
    post:
      operationId: analyzeIncident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentInput"
      responses:
        "201":
          description: Completed diagnosis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /incidents/{id}:
    patch:
      operationId: updateIncident
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IncidentUpdate"
      responses:
        "200":
          description: Updated incident
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Dashboard totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Summary"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    Config:
      type: object
      required: [github_token, gemini_api_key, slack_webhook_url, github_connected, gemini_connected, sentry_webhook_configured]
      properties:
        github_token: { type: boolean }
        gemini_api_key: { type: boolean }
        slack_webhook_url: { type: boolean }
        github_connected: { type: boolean }
        gemini_connected: { type: boolean }
        sentry_webhook_configured: { type: boolean }
    SentryInput:
      type: object
      additionalProperties: true
      properties:
        repository: { type: string }
        branch: { type: string }
        stack_trace: { type: string }
        data: { type: object, additionalProperties: true }
    WebhookJob:
      type: object
      required: [id, repository, status, incident_id, error, created_at, stack_trace, branch, simulated]
      properties:
        id: { type: integer }
        repository: { type: string }
        branch: { type: string }
        stack_trace: { type: string }
        simulated: { type: boolean }
        status: { type: string, enum: [queued, processing, completed, failed] }
        incident_id: { type: [integer, "null"] }
        error: { type: [string, "null"] }
        created_at: { type: string }
    RepositoryInput:
      type: object
      required: [repository, branch]
      properties:
        repository: { type: string, pattern: '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' }
        branch: { type: string, minLength: 1, maxLength: 250 }
    IncidentInput:
      allOf:
        - $ref: "#/components/schemas/RepositoryInput"
        - type: object
          required: [stack_trace]
          properties:
            stack_trace: { type: string, minLength: 10, maxLength: 50000 }
            simulated: { type: boolean, default: false }
    Simulation:
      type: object
      required: [stack_trace, file_path]
      properties:
        stack_trace: { type: string }
        file_path: { type: string }
    IncidentUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [active, resolved] }
    RegressionTest:
      type: object
      required: [file_path, content, run_command, description]
      properties:
        file_path: { type: string }
        content: { type: string }
        run_command: { type: string }
        description: { type: string }
    Diagnosis:
      type: object
      required: [root_cause_summary, suspect_commit_sha, suspect_author, confidence_score, original_code_snippet, patched_code_snippet, full_patched_file, file_path, warnings]
      properties:
        root_cause_summary: { type: string }
        suspect_commit_sha: { type: [string, "null"] }
        suspect_author: { type: [string, "null"] }
        confidence_score: { type: number }
        original_code_snippet: { type: string }
        patched_code_snippet: { type: string }
        full_patched_file: { type: string }
        file_path: { type: string }
        regression_test:
          anyOf:
            - $ref: "#/components/schemas/RegressionTest"
            - type: "null"
        warnings:
          type: array
          items: { type: string }
        source_commit_sha: { type: [string, "null"] }
        suspect_author_login: { type: [string, "null"] }
    Incident:
      type: object
      required: [id, repository, branch, stack_trace, error_type, status, created_at, elapsed_seconds, simulated, diagnosis, pr_url, slack_status, slack_error]
      properties:
        id: { type: integer }
        repository: { type: string }
        branch: { type: string }
        stack_trace: { type: string }
        error_type: { type: string }
        status: { type: string, enum: [active, resolved, draft_pr_opened] }
        created_at: { type: string }
        elapsed_seconds: { type: number }
        simulated: { type: boolean }
        diagnosis: { $ref: "#/components/schemas/Diagnosis" }
        pr_url: { type: [string, "null"] }
        slack_status: { type: string, enum: [not_configured, not_sent, sent, failed] }
        slack_error: { type: [string, "null"] }
    Summary:
      type: object
      required: [total, active, resolved, average_seconds]
      properties:
        total: { type: integer }
        active: { type: integer }
        resolved: { type: integer }
        average_seconds: { type: number }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

